# Disparo de validação integral das rotinas após ajuste de visibilidade do histórico de guerras.
name: Inglorious - Sincronizações automáticas

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automatic-sync.yml
      - src/lib/clash-api.ts
  schedule:
    - cron: "2-59/5 * * * *"
    - cron: "*/15 * * * *"
    - cron: "13 * * * *"
    - cron: "17 * * * *"
    - cron: "23 * * * *"
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inglorious-automatic-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLAN_TAG: "#2RVQ9YGRY"
      APP_TIME_ZONE: America/Sao_Paulo
      CLASH_OF_CLANS_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      CRON_SECRET: ${{ secrets.INGLORIOUS_CRON_SECRET }}
      PORT: "3000"
      HOSTNAME: "127.0.0.1"
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Validar configuração
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASH_OF_CLANS_API_TOKEN" || { echo "::error::Configure o secret CLASH_API_TOKEN"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Configure o secret SUPABASE_URL"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Configure o secret SUPABASE_SECRET_KEY"; exit 1; }
          test -n "$CRON_SECRET" || { echo "::error::Configure o secret INGLORIOUS_CRON_SECRET"; exit 1; }

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Compilar aplicação para execução no runner
        run: npm run build

      - name: Validar formato da chave Clash sem revelar o segredo
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLASH_OF_CLANS_API_TOKEN" | tr -d '[:space:]')"
          if [[ -z "$TOKEN" ]]; then
            echo "::error::A chave Clash está vazia."
            exit 1
          fi
          printf 'Caracteres da chave após remover espaços: %s\n' "${#TOKEN}"
          if [[ "$TOKEN" != "$CLASH_OF_CLANS_API_TOKEN" ]]; then
            echo "A chave contém espaços ou quebras de linha; será usada sem esses caracteres."
          fi
          echo "A chave foi carregada no runner sem exibir seu conteúdo."

      - name: Testar autenticação diretamente no proxy Clash
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(printf '%s' "$CLASH_OF_CLANS_API_TOKEN" | tr -d '[:space:]')"
          STATUS="$(curl --silent --show-error --output /tmp/clash-proxy-response.json --write-out '%{http_code}' \
            --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            -H "auth: $TOKEN" \
            -H "Accept: application/json" \
            "https://cocproxy.royaleapi.dev/v1/clans/%232RVQ9YGRY")"
          printf 'HTTP do proxy Clash: %s\n' "$STATUS"
          if [[ "$STATUS" != "200" ]]; then
            printf 'Resposta do proxy (sem credencial): '
            jq -c '{reason, message}' /tmp/clash-proxy-response.json 2>/dev/null || echo 'corpo não JSON'
            echo "::error::A autenticação Clash foi recusada. Confirme no portal Supercell se a chave está ativa e se o IP 45.79.218.79 está autorizado."
            exit 1
          fi
          echo "Autenticação direta no proxy: sucesso."

      - name: Iniciar servidor local no runner
        shell: bash
        run: |
          set -euo pipefail
          npm run start > /tmp/inglorious-next.log 2>&1 &
          echo $! > /tmp/inglorious-next.pid
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:3000; then
              echo "Servidor local do Inglorious pronto."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/inglorious-next.log
          echo "::error::O servidor local do Inglorious não iniciou."
          exit 1

      - name: Sincronizar guerras (a cada 5 minutos)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '2-59/5 * * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "http://127.0.0.1:3000/api/cron/sync-wars" | tee /tmp/cron-result.json
          jq -e '.success == true' /tmp/cron-result.json

      - name: Sincronizar Liga, doações e Jogos do Clã (a cada 15 minutos)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '*/15 * * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in sync-league sync-donations sync-clan-games; do
            echo "Executando $endpoint"
            curl --fail-with-body --silent --show-error --max-time 180 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "http://127.0.0.1:3000/api/cron/$endpoint" | tee /tmp/cron-result.json
            jq -e '.success == true' /tmp/cron-result.json
          done

      - name: Sincronizar membros do clã (a cada hora)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '13 * * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "http://127.0.0.1:3000/api/cron/sync-roster" | tee /tmp/cron-result.json
          jq -e '.success == true' /tmp/cron-result.json

      - name: Sincronizar Raide (a cada hora)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 * * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "http://127.0.0.1:3000/api/cron/sync-raid" | tee /tmp/cron-result.json
          jq -e '.success == true' /tmp/cron-result.json

      - name: Sincronizar Capital do Clã (a cada hora)
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '23 * * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "http://127.0.0.1:3000/api/cron/sync-capital" | tee /tmp/cron-result.json
          jq -e '.success == true' /tmp/cron-result.json

      - name: Arquivar ranking mensal
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '0 5 1 * *' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 180 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "http://127.0.0.1:3000/api/cron/archive-month" | tee /tmp/cron-result.json
          jq -e '.success == true' /tmp/cron-result.json
